[package]
name = "mp-crypto"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Criptografia do app: vodozemac (Olm 1:1, sem Megolm) e Argon2id, em WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.11.1", default-features = false, features = ["wasm_js"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
