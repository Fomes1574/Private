[package]
name = "kdf-poc"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Prova 2: Argon2id em WASM para o PIN"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
wasm-bindgen = "=0.2.129"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
