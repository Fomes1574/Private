[package]
name = "vz-poc"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Prova 1: wrapper mínimo da vodozemac (Olm 1:1) para WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Versões travadas: a prova mede exatamente esta combinação.
vodozemac = { version = "=0.11.1", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
