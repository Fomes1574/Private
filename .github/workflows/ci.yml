name: ci

on:
  push:
  pull_request:

# Menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version: "1.27", cache: false }
      - name: gitleaks (histórico inteiro)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .

  dependencias:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version: "1.27", cache: false }
      - name: osv-scanner (todas as lockfiles)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          "$(go env GOPATH)/bin/osv-scanner" scan source -r .
      - name: cargo audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          for lock in $(git ls-files '*Cargo.lock'); do
            echo "== $lock"; cargo audit --file "$lock"
          done

  provas-wasm:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        prova: [01-vodozemac-wasm, 02-passkey-prf-pin]
    defaults: { run: { working-directory: "poc/${{ matrix.prova }}" } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Ferramentas Rust travadas
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build reproduzível (o WASM no repositório tem que bater)
        run: |
          ./build.sh
          git diff --exit-code -- web/pkg || { echo "WASM publicado difere do build"; exit 1; }
      - run: npm test

  prova-03:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: poc/03-banco-local-cifrado } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci
      - name: Cópia do SQLite confere com o pacote travado
        run: node vendor.mjs --check
      - run: npm test

  prova-04:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: poc/04-atualizacao-sw } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm test

  protocolo:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: packages/protocol } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm test
      - name: Mesmo resultado em outro fuso horário
        env: { TZ: "Asia/Tokyo" }
        run: npm test

  prova-05:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: poc/05-ver-uma-vez } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci
      - name: Worker local (workerd) nos modos DO e R2
        env: { WRANGLER_SEND_METRICS: "false" }
        run: npm test

  prova-06:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: poc/06-video-safari } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci
      - name: Cópia da mediabunny confere com o pacote travado
        run: node vendor.mjs --check
      - run: npm test

  navegador:
    runs-on: ubuntu-24.04
    needs: [provas-wasm, prova-03, prova-04, prova-06]
    defaults: { run: { working-directory: e2e } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
