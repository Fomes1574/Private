name: android

# Compila o APK (o mesmo app web dentro do APK, ADR 0007). O runner do GitHub
# já tem o Android SDK. APK de debug como artefato; o de distribuição precisa
# da chave de assinatura do proprietário (segredos ANDROID_*), ver docs.
on:
  push:
    paths: ['android-app/**', 'app/**', 'packages/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: App web + Capacitor
        working-directory: android-app
        env:
          MP_API: ${{ vars.MP_API_ORIGIN || 'https://api.invalid' }}
        run: |
          npm ci
          npm run sync
      - name: Conferências de segurança no projeto Android
        working-directory: android-app/android
        run: |
          grep -q 'FLAG_SECURE' app/src/main/java/com/mensageiro/privado/MainActivity.java
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'FileProvider' app/src/main/AndroidManifest.xml
          grep -q 'Content-Security-Policy' app/src/main/assets/public/index.html
      - name: Compilar APK de debug
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: apk-debug
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
