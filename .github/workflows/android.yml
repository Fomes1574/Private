name: android

# Compila o APK (o mesmo app web dentro do APK, ADR 0007) e testa:
# - debug (com.pactotalk.app.debug) como artefato, para teste rápido;
# - release DE TESTE: mesma configuração da distribuição, assinado com uma
#   chave descartável gerada pela própria página da chave, conferido pelo
#   script de verificação e aberto num emulador (FLAG_SECURE, sem depuração,
#   sem backup, permissões). Não publica nada: a distribuição é o workflow
#   android-release, com a chave permanente do proprietário.
on:
  push:
    paths: ['android-app/**', 'app/**', 'packages/**', 'tools/**', 'scripts/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "22" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - name: Página da chave do APK gera certificado válido
        run: node --test tools/chave-android.test.mjs
      - name: Scanner de resíduos de mídia (dados sintéticos)
        run: python3 scripts/android/test-verificar-blobs.py
      - name: App web + Capacitor
        working-directory: android-app
        env:
          MP_API: ${{ vars.MP_API_ORIGIN || 'https://api.invalid' }}
        run: |
          npm ci
          npm run sync
      - name: Conferências de segurança no projeto Android
        working-directory: android-app/android
        run: |
          grep -q 'FLAG_SECURE' app/src/main/java/com/mensageiro/privado/MainActivity.java
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'FileProvider' app/src/main/AndroidManifest.xml
          grep -q 'Content-Security-Policy' app/src/main/assets/public/index.html
          # Sem Firebase/Google no APK (decisão de 24/10/2026).
          ! grep -rqi 'firebase\|google-services\|play-services' app/build.gradle build.gradle app/src/main/AndroidManifest.xml
          [ ! -e app/google-services.json ]
      - name: Compilar APK de debug
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apk-debug
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 1
      - name: Compilar release (sem assinatura)
        working-directory: android-app/android
        env: { MP_VERSION_CODE: "1", MP_VERSION_NAME: "0.0.0-teste" }
        run: ./gradlew --no-daemon assembleRelease
      - name: Assinar com chave DESCARTÁVEL e verificar
        run: |
          d=$(mktemp -d)
          node tools/chave-android.mjs "$d"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk "$d/aligned.apk"
          "$BT/apksigner" sign --key "$d/key.der" --cert "$d/cert.pem" --v4-signing-enabled false --out "$RUNNER_TEMP/teste-release.apk" "$d/aligned.apk"
          bash scripts/android/verificar-apk.sh "$RUNNER_TEMP/teste-release.apk" "$(cat "$d/sha256.txt")" com.pactotalk.app 1
          rm -rf "$d"
      - name: Liberar disco para o emulador
        # O runner chega com ~7 GB livres depois do build; o emulador pede mais.
        # Só ferramentas que este job não usa.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h "$HOME"
      - name: Ligar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador (Android 14) com o APK de release
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          disk-size: 3000M
          api-level: 34
          # Imagem "user" (como um celular de verdade). A google_apis comum é
          # userdebug e liga a depuração de todo WebView, o que invalidaria o teste.
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android/teste-emulador.sh "$RUNNER_TEMP/teste-release.apk" com.pactotalk.app
