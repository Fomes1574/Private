# API do Mensageiro Privado (Arquitetura A). Origem separada do app (ADR 0004).
name = "mp-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Sem logs de requisição (ADR 0008).
[observability]
enabled = false

[triggers]
crons = ["*/15 * * * *"]

[vars]
# Mídia cifrada no R2 (Arquitetura A, V6-006/V6-007). "do" guarda no SQLite
# do Durable Object (alternativa sem R2; limite total de 5 GB no plano grátis).
BLOB_BACKEND = "r2"
# Origem do app (CORS). Trocar pelo endereço definitivo antes do uso real (P-07).
APP_ORIGIN = "http://localhost:8792"
VAPID_SUBJECT = "http://localhost:8792"
# Segredos (wrangler secret put): SETUP_CODE, VAPID_PRIVATE_JWK, VAPID_PUBLIC.

# Só ciphertext. Regra de ciclo de vida apaga qualquer objeto com mais de
# 16 dias (prazo máximo é 15), mesmo se a limpeza do app falhar.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mp-media"

[[d1_databases]]
binding = "DB"
database_name = "mp-db"
# Preenchido pelo workflow de deploy depois de criar o banco.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CIRCLE"
class_name = "Circle"
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
[[durable_objects.bindings]]
name = "MEDIA_BOX"
class_name = "MediaBox"
[[durable_objects.bindings]]
name = "DOC_QUOTA"
class_name = "DocQuota"
[[durable_objects.bindings]]
name = "LIVE"
class_name = "Live"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Circle", "Room", "MediaBox", "DocQuota", "Live"]
